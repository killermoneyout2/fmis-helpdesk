<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Facilities Help Desk — Lancaster University Ghana</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#EEF1F4; --surface:#FFFFFF; --ink:#17232E; --ink-soft:#5A6B78;
    --line:#DBE1E7; --brand:#A11B2E; --brand-dark:#7E1524; --slate:#2C4A63;
    --pend-fg:#B26A00; --pend-bg:#FBECD3;
    --ongo-fg:#1E5FA8; --ongo-bg:#DCEAFA;
    --done-fg:#1B7A3D; --done-bg:#D8EFDF;
    --outs-fg:#9C3B2E; --outs-bg:#F5DED8;
    --disp:'Space Grotesk',ui-sans-serif,system-ui,sans-serif;
    --body:'Inter',ui-sans-serif,system-ui,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);
    font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:14px}

  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;
    background:var(--ink);color:#fff;padding:14px 22px;position:sticky;top:0;z-index:10}
  .brand{display:flex;align-items:center;gap:12px;min-width:0}
  .crest{width:34px;height:34px;border-radius:6px;background:var(--brand);
    display:grid;place-items:center;font-family:var(--disp);font-weight:700;color:#fff;
    font-size:15px;flex:none}
  .brand h1{font-family:var(--disp);font-size:15px;font-weight:600;margin:0;letter-spacing:.2px}
  .brand span{display:block;font-size:11px;color:#9fb0bd;font-weight:500;letter-spacing:.4px;text-transform:uppercase}
  .whoami{display:flex;align-items:center;gap:12px;font-size:13px;flex:none}
  .whoami .u{text-align:right;line-height:1.25}
  .whoami .u b{font-weight:600}
  .whoami .u small{color:#9fb0bd;text-transform:capitalize}
  .ghost{background:transparent;border:1px solid #3a4a57;color:#cfd8de;
    padding:7px 12px;border-radius:7px;font-size:13px;font-weight:500}
  .ghost:hover{border-color:#5a6b78;color:#fff}

  .wrap{max-width:1080px;margin:0 auto;padding:26px 22px 60px}

  .login{max-width:440px;margin:8vh auto 0;background:var(--surface);
    border:1px solid var(--line);border-radius:14px;padding:30px;
    box-shadow:0 18px 40px -24px rgba(23,35,46,.4)}
  .login h2{font-family:var(--disp);font-size:22px;margin:0 0 4px}
  .login .sub{color:var(--ink-soft);font-size:14px;margin:0 0 22px}
  .seg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;background:var(--bg);
    padding:5px;border-radius:10px;margin-bottom:16px}
  .seg button{border:none;background:transparent;padding:9px 6px;border-radius:7px;
    font-size:13px;font-weight:600;color:var(--ink-soft)}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  label.fl{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);
    text-transform:uppercase;letter-spacing:.5px;margin:14px 0 6px}
  .field{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;
    background:#fff;color:var(--ink)}
  .field:focus{outline:2px solid var(--slate);outline-offset:0;border-color:transparent}
  .primary{width:100%;margin-top:20px;background:var(--brand);color:#fff;border:none;
    padding:12px;border-radius:9px;font-weight:600;font-size:15px}
  .primary:hover{background:var(--brand-dark)}
  .primary:disabled{opacity:.6;cursor:default}
  .hint{font-size:12px;color:var(--ink-soft);margin-top:14px;text-align:center}
  .switch{background:none;border:none;color:var(--brand);font-weight:600;font-size:12px;
    padding:0;text-decoration:underline;text-underline-offset:2px;cursor:pointer}
  .err{color:var(--brand);font-size:13px;margin-top:12px;text-align:center;min-height:16px}

  .cols{display:grid;grid-template-columns:340px 1fr;gap:22px;align-items:start}
  @media(max-width:820px){.cols{grid-template-columns:1fr}}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
  .card .hd{padding:16px 18px;border-bottom:1px solid var(--line)}
  .card .hd h3{margin:0;font-family:var(--disp);font-size:16px;font-weight:600}
  .card .hd p{margin:2px 0 0;font-size:12.5px;color:var(--ink-soft)}
  .card .bd{padding:18px}
  .form-row{margin-bottom:13px}
  .form-row label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);
    margin-bottom:5px;letter-spacing:.3px}
  .submit{width:100%;background:var(--slate);color:#fff;border:none;padding:11px;
    border-radius:9px;font-weight:600;margin-top:4px}
  .submit:hover{filter:brightness(1.08)}

  .stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:20px}
  @media(max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:13px 14px}
  .stat .n{font-family:var(--disp);font-size:26px;font-weight:700;line-height:1}
  .stat .l{font-size:11.5px;color:var(--ink-soft);text-transform:uppercase;
    letter-spacing:.5px;margin-top:5px;font-weight:600}
  .stat.total .n{color:var(--ink)}
  .stat.pend .n{color:var(--pend-fg)} .stat.ongo .n{color:var(--ongo-fg)}
  .stat.done .n{color:var(--done-fg)} .stat.outs .n{color:var(--outs-fg)}

  .filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
  .filters select,.filters input{padding:9px 11px;border:1px solid var(--line);
    border-radius:8px;background:#fff}
  .filters .grow{flex:1;min-width:160px}
  .count{font-size:13px;color:var(--ink-soft);margin-left:auto}

  .ticket{background:var(--surface);border:1px solid var(--line);border-radius:12px;
    margin-bottom:14px;overflow:hidden;display:grid;grid-template-columns:6px 1fr}
  .spine{width:6px}
  .spine.Pending{background:var(--pend-fg)} .spine.Ongoing{background:var(--ongo-fg)}
  .spine.Completed{background:var(--done-fg)} .spine.Outstanding{background:var(--outs-fg)}
  .t-body{padding:15px 17px}
  .t-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
  .tid{font-family:var(--mono);font-weight:600;font-size:13px;color:var(--slate);
    background:var(--bg);padding:3px 8px;border-radius:6px;letter-spacing:.3px}
  .pill{font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:20px;letter-spacing:.2px}
  .pill.Pending{color:var(--pend-fg);background:var(--pend-bg)}
  .pill.Ongoing{color:var(--ongo-fg);background:var(--ongo-bg)}
  .pill.Completed{color:var(--done-fg);background:var(--done-bg)}
  .pill.Outstanding{color:var(--outs-fg);background:var(--outs-bg)}
  .cat{font-size:12px;font-weight:600;color:var(--ink-soft);border:1px solid var(--line);
    padding:2px 9px;border-radius:20px}
  .prio{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
  .prio.high{color:var(--brand)} .prio.medium{color:var(--pend-fg)} .prio.low{color:var(--ink-soft)}
  .t-desc{font-size:14.5px;margin:2px 0 10px}
  .t-meta{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-soft);margin-bottom:4px}
  .t-meta b{color:var(--ink);font-weight:600}
  .t-controls{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);
    display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .t-controls select,.t-controls input{padding:8px 10px;border:1px solid var(--line);
    border-radius:7px;background:#fff;font-size:13px}
  .t-controls .reason{flex:1;min-width:150px}
  .mini{background:var(--ink);color:#fff;border:none;padding:8px 13px;border-radius:7px;
    font-size:13px;font-weight:600}
  .mini:hover{background:#000}
  .linklike{background:none;border:none;color:var(--slate);font-size:12.5px;font-weight:600;
    padding:0;text-decoration:underline;text-underline-offset:2px}
  .history{margin-top:11px;border-top:1px solid var(--line);padding-top:11px;display:none}
  .history.open{display:block}
  .hitem{display:flex;gap:10px;font-size:12.5px;color:var(--ink-soft);padding:4px 0}
  .hitem .dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex:none}
  .hitem b{color:var(--ink);font-weight:600}
  .hitem .hr{color:var(--ink)}
  .empty{text-align:center;color:var(--ink-soft);padding:40px 20px;
    background:var(--surface);border:1px dashed var(--line);border-radius:12px}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:#fff;padding:11px 18px;border-radius:9px;font-size:14px;
    font-weight:500;opacity:0;transition:.28s;z-index:50;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast b{font-family:var(--mono);font-weight:600}
  .section-title{font-family:var(--disp);font-size:15px;font-weight:600;margin:0 0 12px}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script src="/app.js"></script>
</body>
</html>
